<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="포켓몬 트레이너가 되어 12가지 순간을 고르면 내 MBTI와 닮은꼴 포켓몬을 알려 주는 재미용 테스트">
<meta property="og:title" content="닮은꼴 포켓몬 MBTI">
<meta property="og:description" content="12문제로 알아보는 나랑 닮은 포켓몬">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>닮은꼴 포켓몬 MBTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 한 장짜리 '트레이너 수첩' — 질문 카드가 한 장씩 넘어가고, 결과는 도감 기록 카드 한 장 */
:root{
  --bg:#EFEEF6; --surface:#FFFFFF; --ink:#1C1A2B; --muted:#6B6880; --line:#D9D7E6;
  --accent:#FFCB3D; --accent-ink:#1C1A2B; --blue:#3552D6; --blue-soft:#E3E8FB;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14131C; --surface:#1F1D2C; --ink:#F1EFFA; --muted:#A3A0B8; --line:#34314A;
  --accent:#FFCB3D; --accent-ink:#1C1A2B; --blue:#8EA2FF; --blue-soft:#272C4D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14131C; --surface:#1F1D2C; --ink:#F1EFFA; --muted:#A3A0B8; --line:#34314A;
  --accent:#FFCB3D; --accent-ink:#1C1A2B; --blue:#8EA2FF; --blue-soft:#272C4D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding:0 16px}
.wrap{max-width:520px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* 시작 화면 */
.intro h1{font-size:clamp(40px,11vw,60px);line-height:1.05}
.intro h1 mark{background:var(--accent);color:var(--accent-ink);padding:0 .12em;border-radius:6px}
.intro .lead{color:var(--muted);margin-top:12px;max-width:34ch}
.facts{display:flex;gap:20px;margin-top:18px;font-family:var(--mono);font-size:13px}
.facts b{display:block;font-size:22px;color:var(--ink)}
.facts span{color:var(--muted)}
.start{margin-top:6px;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:16px 20px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;width:100%}
.start:hover{transform:translateY(-1px)}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.roster div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.roster small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.roster span{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.note{font-size:12px;color:var(--muted)}

/* 질문 화면 */
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--muted)}
.back:disabled{opacity:.35;cursor:default}
.count{font-family:var(--mono);font-size:14px;margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.q h2{font-size:clamp(26px,7vw,34px);line-height:1.25;min-height:2.5em}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.45;transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt.picked{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.opt .k{font-family:var(--mono);font-weight:700;font-size:13px;border:1.5px solid currentColor;border-radius:6px;padding:1px 7px;flex:none;margin-top:2px}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 결과 카드 */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.card-head{position:relative;padding:22px 22px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:2px dashed var(--line);background:color-mix(in srgb,var(--tc) 20%,var(--surface))}
.card-head h2,.card-head .cls{padding-right:104px}
.emblem{position:absolute;right:18px;top:46px;width:88px;height:88px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -7px 0 rgba(0,0,0,.18),0 0 0 4px var(--surface)}
.emblem svg{width:50px;height:50px}
.pop{animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
.pop .emblem{animation:spin .8s .15s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotate(-200deg) scale(.3)}to{transform:none}}
.dex{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:16px;padding:16px;text-decoration:none;font-weight:700;font-size:18px;box-shadow:4px 4px 0 var(--ink)}
.dex:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.dex small{font-weight:500;font-size:13px;opacity:.75}
/* 두구두구 */
.drum{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.drum h2{font-size:clamp(40px,12vw,58px)}
.drum p{color:var(--muted)}
.dots{display:flex;gap:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);animation:hop .6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.1s}.dots i:nth-child(3){animation-delay:.2s}
@keyframes hop{0%,100%{transform:none}50%{transform:translateY(-14px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.dexno{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted)}
.mbti{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 8px}
.card-head h2{font-size:clamp(44px,13vw,64px);line-height:1}
.cls{color:var(--muted);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;color:#fff}
.card-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:18px}
.tagline{font-size:19px;font-weight:700;line-height:1.45}
.desc{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.kv dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);padding-top:3px;text-transform:uppercase}
.kv dd{margin:0;min-width:0}
.axes{display:flex;flex-direction:column;gap:10px}
.axis{display:grid;grid-template-columns:4.2em 1fr 4.2em;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.axis .l{text-align:left}.axis .r{text-align:right}
.axis b{font-family:var(--mono)}
.axis .on{color:var(--ink)} .axis .off{color:var(--muted)}
.track{height:10px;background:var(--blue-soft);border-radius:99px;position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;background:var(--blue);border-radius:99px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;border-radius:14px;padding:14px 16px;font-weight:700;border:2px solid var(--ink);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--bg)}
.toast{font-size:14px;color:var(--blue);min-height:1.4em;text-align:center}
.copybox{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:none}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:700}
.all{display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.all div{display:grid;grid-template-columns:3.4em 6.5em 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.all div.me{font-weight:700}
.all b{font-family:var(--mono);font-size:13px}
.all span:last-child{color:var(--muted);min-width:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const T = {불꽃:"#E2622B",물:"#2F7FD8",풀:"#3E9A4A",전기:"#C99A06",에스퍼:"#D14E86",고스트:"#6A54A6",격투:"#B0442F",노말:"#8C8A78",독:"#9447A8",격투2:"#B0442F",강철:"#5E7D8C",페어리:"#D06BAA",드래곤:"#5843D6",비행:"#6F8FD8",악:"#4E4440"};

const Q = [
  {ax:"EI", q:"오늘 드디어 첫 포켓몬을 받는 날! 연구소에 도착하니 다른 트레이너들이 북적인다", a:[["먼저 다가가 “너는 누구 고를 거야?”","E"],["구석에서 조용히 차례를 기다린다","I"]]},
  {ax:"SN", q:"처음 보는 포켓몬이 풀숲에서 튀어나왔다!", a:[["일단 도감부터 펼쳐 타입과 기술을 확인한다","S"],["“무슨 포켓몬이지? 진화하면 어떻게 될까?” 상상부터 한다","N"]]},
  {ax:"TF", q:"배틀에서 진 내 포켓몬이 풀이 죽어 있다", a:[["“괜찮아, 잘 싸웠어” 꼭 안아 준다","F"],["어디서 졌는지 같이 되짚어 본다","T"]]},
  {ax:"JP", q:"다음 마을로 떠나기 전날 밤", a:[["가는 길에 뭐가 있을지는 내일 가서 보자!","P"],["지도 펴고 루트랑 쉴 포켓몬센터까지 정해 둔다","J"]]},
  {ax:"EI", q:"포켓몬센터 로비에 낯선 트레이너들이 모여 있다", a:[["내 포켓몬 회복될 때까지 혼자 쉰다","I"],["“배틀 한 판 할래요?” 먼저 말을 건다","E"]]},
  {ax:"SN", q:"동료들과 모닥불 앞, 더 신나는 이야기는?", a:[["“전설의 포켓몬이 진짜 나타난다면?”","N"],["“오늘 잡은 포켓몬, 기술 배치 어떻게 할까?”","S"]]},
  {ax:"TF", q:"동료가 레어 포켓몬을 양보하라고 한다. 둘 다 갖고 싶은데…", a:[["누가 더 잘 키울 수 있는지 따져 본다","T"],["서로 서운하지 않게 방법을 찾는다","F"]]},
  {ax:"JP", q:"체육관 도전까지 일주일 남았다", a:[["오늘부터 매일 훈련 일정표대로!","J"],["며칠 놀다가 막판에 몰아서 특훈!","P"]]},
  {ax:"EI", q:"긴 여행에 지쳤을 때 내가 힘을 얻는 법", a:[["마을 축제에 가서 사람들이랑 신나게 논다","E"],["내 포켓몬이랑 단둘이 호숫가에서 쉰다","I"]]},
  {ax:"SN", q:"여행을 마치고 돌아보니 제일 먼저 떠오르는 건", a:[["그 순간 느꼈던 두근거림과 바람","N"],["어느 체육관에서 무슨 배지를 땄는지","S"]]},
  {ax:"TF", q:"라이벌이 반칙 같은 작전으로 이겼다", a:[["규칙상 문제없으면 인정, 다음엔 대책을 세운다","T"],["상대 포켓몬이 다치진 않았는지 먼저 마음이 쓰인다","F"]]},
  {ax:"JP", q:"내 가방 속 상태는", a:[["대충 넣어도 어디 있는지 나는 안다","P"],["몬스터볼, 상처약, 열매 칸이 딱 나뉘어 있다","J"]]},
];

const R = {
  ENFP:{n:"피카츄",no:"025",t:["전기"],c:"쥐포켓몬",line:"어디서든 분위기를 밝히는 반짝 에너지",d:"호기심 많고 정이 넘쳐서 처음 보는 사람과도 금방 친해져요. 하고 싶은 게 많아 이것저것 벌이지만, 마음 가는 사람 곁은 끝까지 지키는 의리파예요.",s:"친화력, 아이디어, 긍정 에너지",m:"INFJ"},
  ENTP:{n:"팬텀",no:"094",t:["고스트","독"],c:"그림자포켓몬",line:"장난 반, 아이디어 반 — 지루한 건 못 참아",d:"남들이 당연하게 여기는 걸 일부러 뒤집어 보는 걸 좋아해요. 말재주가 좋아 토론에서 잘 밀리지 않고, 장난 속에 날카로운 생각이 숨어 있어요.",s:"순발력, 말재주, 발상 전환",m:"INTJ"},
  ENTJ:{n:"리자몽",no:"006",t:["불꽃","비행"],c:"화염포켓몬",line:"목표가 보이면 곧장 날아가는 리더",d:"큰 그림을 그리고 사람들을 끌고 가는 데 능해요. 자존심이 세서 쉽게 물러서지 않지만, 인정한 상대에게는 든든한 동료가 돼요.",s:"추진력, 결단력, 카리스마",m:"INTP"},
  ENFJ:{n:"해피너스",no:"242",t:["노말"],c:"행복포켓몬",line:"모두가 잘되길 바라는 다정한 리더",d:"주변 사람의 기분을 빨리 알아차리고 먼저 챙겨요. 사람들을 하나로 모으는 힘이 있지만, 남 챙기다 정작 자기 몫은 잊을 때가 있어요.",s:"공감, 격려, 사람을 모으는 힘",m:"INFP"},
  INFJ:{n:"가디안",no:"282",t:["에스퍼","페어리"],c:"포옹포켓몬",line:"말하지 않아도 마음을 읽는 조용한 수호자",d:"겉으로는 차분하지만 속에는 확고한 신념이 있어요. 소중한 사람을 위해서라면 누구보다 강해지는 타입이에요.",s:"통찰력, 배려, 깊은 신념",m:"ENFP"},
  INFP:{n:"뮤",no:"151",t:["에스퍼"],c:"신종포켓몬",line:"자기만의 세계에서 자유롭게 떠다니는 몽상가",d:"상상력이 풍부하고 감수성이 깊어요. 남 눈치보다 내 마음이 시키는 걸 따라가고, 좋아하는 일에는 엄청난 몰입을 보여요.",s:"상상력, 순수함, 진정성",m:"ENFJ"},
  INTJ:{n:"뮤츠",no:"150",t:["에스퍼"],c:"유전포켓몬",line:"혼자서도 다 계획이 있는 전략가",d:"머릿속에 이미 몇 수 앞까지 그려져 있어요. 독립적이고 자기 기준이 분명해서, 납득되지 않으면 쉽게 따르지 않아요.",s:"전략, 집중력, 독립성",m:"ENTP"},
  INTP:{n:"후딘",no:"065",t:["에스퍼"],c:"염력포켓몬",line:"궁금한 게 생기면 끝까지 파고드는 연구가",d:"원리와 구조를 이해해야 직성이 풀려요. 조용히 생각에 빠져 있다가 가끔 툭 던지는 한마디가 핵심을 찌르곤 해요.",s:"분석력, 지식욕, 냉철함",m:"ENTJ"},
  ESTJ:{n:"괴력몬",no:"068",t:["격투"],c:"괴력포켓몬",line:"맡은 일은 네 팔로 확실하게 해내는 일꾼",d:"규칙과 순서를 중요하게 여기고 책임감이 강해요. 일이 굴러가게 만드는 실무형 리더라 팀에서 믿고 맡기는 사람이에요.",s:"책임감, 실행력, 체계",m:"ISFP"},
  ESFJ:{n:"망나뇽",no:"149",t:["드래곤","비행"],c:"드래곤포켓몬",line:"강하지만 누구보다 다정한 해결사",d:"사람들 사이의 분위기를 살피고 모두가 편하도록 챙겨요. 도움이 필요한 곳이면 어디든 날아가는 따뜻한 타입이에요.",s:"친절, 협동, 세심함",m:"ISTP"},
  ISTJ:{n:"거북왕",no:"009",t:["물"],c:"껍질포켓몬",line:"묵직하고 믿음직한 원칙주의자",d:"한번 맡은 일은 끝까지 해내고 약속을 잘 지켜요. 말수는 적어도 행동으로 보여 주는 든든한 버팀목이에요.",s:"성실함, 꾸준함, 신뢰",m:"ESFP"},
  ISFJ:{n:"이상해씨",no:"001",t:["풀","독"],c:"씨앗포켓몬",line:"뒤에서 묵묵히 챙겨 주는 따뜻한 동료",d:"조용하지만 주변 사람의 작은 변화도 잘 알아채요. 익숙한 곳에서 소중한 사람들과 함께하는 걸 좋아해요.",s:"헌신, 기억력, 안정감",m:"ESTP"},
  ISTP:{n:"개굴닌자",no:"658",t:["물","악"],c:"시노비포켓몬",line:"말보다 실력으로 보여 주는 조용한 고수",d:"상황 판단이 빠르고 손재주가 좋아요. 간섭받는 걸 싫어하고, 위기 때 가장 침착하게 움직이는 타입이에요.",s:"침착함, 손재주, 순발력",m:"ESFJ"},
  ISFP:{n:"이브이",no:"133",t:["노말"],c:"진화포켓몬",line:"어떤 모습으로든 피어날 수 있는 자유로운 감성",d:"그때그때 느낌에 충실하고 취향이 확실해요. 겉으론 순해 보여도 자기만의 색이 뚜렷하고, 환경에 따라 다양하게 변신해요.",s:"감수성, 유연함, 미적 감각",m:"ESTJ"},
  ESTP:{n:"갸라도스",no:"130",t:["물","비행"],c:"흉악포켓몬",line:"생각보다 몸이 먼저 나가는 행동파",d:"스릴과 도전을 즐기고 위기에 강해요. 지루한 설명보다 직접 부딪혀 보는 게 빠르다고 믿어요.",s:"대담함, 실전 감각, 에너지",m:"ISFJ"},
  ESFP:{n:"푸린",no:"039",t:["노말","페어리"],c:"풍선포켓몬",line:"무대만 있으면 신나는 분위기 메이커",d:"사람들의 시선을 즐기고 지금 이 순간을 제일 재밌게 보내는 법을 알아요. 어딜 가든 노래 한 곡 뽑을 준비가 돼 있어요.",s:"표현력, 흥, 사교성",m:"ISTJ"},
};

const SLUG = {ENFP:"pikachu",ENTP:"gengar",ENTJ:"charizard",ENFJ:"blissey",INFJ:"gardevoir",INFP:"mew",INTJ:"mewtwo",INTP:"alakazam",ESTJ:"machamp",ESFJ:"dragonite",ISTJ:"blastoise",ISFJ:"bulbasaur",ISTP:"greninja",ISFP:"eevee",ESTP:"gyarados",ESFP:"jigglypuff"};
const ICON = {
  전기:'<path d="M27 3 9 27h11l-3 18 20-26H26z"/>',
  불꽃:'<path d="M24 3c2 8 13 12 13 25a13 13 0 0 1-26 0c0-6 3-10 5-12 0 4 2 7 4 7-1-7 1-13 4-20z"/>',
  물:'<path d="M24 3C18 14 11 21 11 30a13 13 0 0 0 26 0c0-9-7-16-13-27zm-6 27a6 6 0 0 0 6 6v3a9 9 0 0 1-9-9z" fill-rule="evenodd"/>',
  풀:'<path d="M41 7C22 7 9 15 9 30c0 3 1 6 2 8l-4 4 2.5 2.5 4-4c2 1.5 5 2.5 8.5 2.5C36 43 41 29 41 7zM16 35c3-8 9-14 17-19-5 5-10 11-13 20z" fill-rule="evenodd"/>',
  노말:'<path d="M24 4l5.8 12.6L43 18.4l-9.8 9.4L35.8 42 24 35.2 12.2 42l2.6-14.2L5 18.4l13.2-1.8z"/>',
  에스퍼:'<path d="M24 11C13 11 5 19 2 24c3 5 11 13 22 13s19-8 22-13c-3-5-11-13-22-13zm0 21a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill-rule="evenodd"/><circle cx="24" cy="24" r="3.5"/>',
  고스트:'<path d="M24 4C15 4 9 11 9 20v24l5-4 5 4 5-4 5 4 5-4 5 4V20c0-9-6-16-15-16zm-6 19a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm12 0a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z" fill-rule="evenodd"/>',
  격투:'<path d="M24 3l4 13 13-7-8 12 12 5-13 3 4 14-12-10-12 10 4-14-13-3 12-5-8-12 13 7z"/>',
  드래곤:'<path d="M15 5l6 2-8 35-5-2zM26 5l6 2-8 35-5-2zM37 5l6 2-8 35-5-2z"/>'
};
const app = document.getElementById("app");
let step = -1, picks = [];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function intro(){
  step=-1; picks=[];
  const order=["ISTJ","ISFJ","INFJ","INTJ","ISTP","ISFP","INFP","INTP","ESTP","ESFP","ENFP","ENTP","ESTJ","ESFJ","ENFJ","ENTJ"];
  app.innerHTML=`
  <section class="intro">
    <p class="eyebrow">재미로 보는 성격 테스트</p>
    <h1>나랑 닮은<br><mark>포켓몬</mark>은?</h1>
    <p class="lead">당신은 이제 막 여행을 떠나는 포켓몬 트레이너! 여정 속 12가지 순간에 어떻게 할지 골라 주세요. 내 MBTI와 닮은꼴 포켓몬을 알려 드려요.</p>
    <div class="facts"><div><b>12</b><span>문항</span></div><div><b>약 1분</b><span>소요</span></div><div><b>16</b><span>가지 결과</span></div></div>
  </section>
  <button class="start" id="go">테스트 시작 <span>→</span></button>
  <p class="note">팬이 재미로 만든 비공식 테스트예요. MBTI 결과는 심리 검사가 아니에요.</p>`;
  document.getElementById("go").onclick=()=>{step=0;question()};
}

function question(){
  const item=Q[step];
  app.innerHTML=`
  <div class="top">
    <button class="back" id="back" ${step===0?"":""}>← 이전</button>
    <span class="count">${String(step+1).padStart(2,"0")} / ${Q.length}</span>
  </div>
  <div class="bar"><i style="width:${(step)/Q.length*100}%"></i></div>
  <section class="q fade">
    <h2>${esc(item.q)}</h2>
  </section>
  <div class="opts fade">
    ${item.a.map((o,i)=>`<button class="opt${picks[step]===o[1]?" picked":""}" data-v="${o[1]}"><span class="k">${"AB"[i]}</span><span>${esc(o[0])}</span></button>`).join("")}
  </div>`;
  document.getElementById("back").onclick=()=>{ if(step===0){intro()} else {step--;question()} };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    picks[step]=b.dataset.v; b.classList.add("picked");
    app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    setTimeout(()=>{ step++; step<Q.length?question():drum(); },220);
  });
}

function drum(){
  app.innerHTML=`<section class="drum fade">
    <div class="dots"><i></i><i></i><i></i></div>
    <h2>두구두구…</h2>
    <p>나랑 닮은 포켓몬을 찾는 중이에요</p>
  </section>`;
  const slow=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(result, slow?300:1800);
}

function confetti(colors){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.id="confetti"; document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const ps=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:colors[Math.floor(Math.random()*colors.length)]}));
  const t0=performance.now();
  (function f(t){
    const k=(t-t0)/2400; g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-k);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore();});
    k<1?requestAnimationFrame(f):cv.remove();
  })(t0);
}

function score(){
  const c={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  picks.forEach(v=>c[v]++);
  const type=(c.E>c.I?"E":"I")+(c.S>c.N?"S":"N")+(c.T>c.F?"T":"F")+(c.J>c.P?"J":"P");
  return {c,type};
}

function result(){
  const {c,type}=score(); const r=R[type]; const m=R[r.m];
  const axes=[["E","외향","I","내향"],["S","감각","N","직관"],["T","사고","F","감정"],["J","판단","P","인식"]];
  const order=Object.keys(R);
  app.innerHTML=`
  <p class="eyebrow">기록 완료 · 나의 닮은꼴</p>
  <article class="card pop" style="--tc:${T[r.t[0]]}">
    <div class="card-head">
      <div class="emblem" aria-hidden="true"><svg viewBox="0 0 48 48" fill="currentColor">${ICON[r.t[0]]||ICON.노말}</svg></div>
      <div class="dexno"><span>No.${r.no}</span><span class="mbti">${type}</span></div>
      <h2>${r.n}</h2>
      <p class="cls">${r.c}</p>
      <div class="chips">${r.t.map(t=>`<span class="chip" style="background:${T[t]}">${t}</span>`).join("")}</div>
    </div>
    <div class="card-body">
      <p class="tagline">${r.line}</p>
      <p class="desc">${r.d}</p>
      <dl class="kv">
        <dt>강점</dt><dd>${r.s}</dd>
        <dt>찰떡 궁합</dt><dd>${m.n} <span style="color:var(--muted)">(${r.m})</span></dd>
      </dl>
      <div class="axes">
        ${axes.map(([a,al,b,bl])=>{const tot=c[a]+c[b]||1;const pa=Math.round(c[a]/tot*100);const pb=100-pa;const win=c[a]>c[b];
          return `<div class="axis"><span class="l ${win?"on":"off"}"><b>${a}</b> ${al}</span>
          <div class="track" aria-label="${al} ${pa}%, ${bl} ${pb}%"><i style="${win?`left:0;width:${pa}%`:`right:0;width:${pb}%`}"></i></div>
          <span class="r ${win?"off":"on"}">${bl} <b>${b}</b></span></div>`}).join("")}
      </div>
    </div>
  </article>
  <a class="dex" href="https://www.pokemon.com/us/pokedex/${SLUG[type]}" target="_blank" rel="noopener">공식 도감에서 진짜 ${r.n} 보기 ↗<small>포켓몬 공식 사이트(영어)가 새 창으로 열려요</small></a>
  <div class="actions">
    <button class="btn primary" id="share">결과 문구 복사</button>
    <button class="btn" id="again">다시 하기</button>
  </div>
  <p class="toast" id="toast" aria-live="polite"></p>
  <details>
    <summary>16가지 결과 모두 보기</summary>
    <div class="all">${order.map(k=>`<div class="${k===type?"me":""}"><b>${k}</b><span>${R[k].n}</span><span>${R[k].line}</span></div>`).join("")}</div>
  </details>`;
  const text=`나의 MBTI는 ${type}, 닮은꼴 포켓몬은 ${r.n}! “${r.line}” 너는 어떤 포켓몬이야?`;
  document.getElementById("again").onclick=intro;
  document.getElementById("share").onclick=()=>{
    const t=document.getElementById("toast");
    const fallback=()=>{t.innerHTML=`<textarea class="copybox" id="cb" rows="3" readonly>${esc(text)}</textarea>`;const cb=document.getElementById("cb");cb.focus();cb.select();};
    try{ navigator.clipboard.writeText(text).then(()=>{t.textContent="복사했어요. 단톡방에 붙여 넣어 보세요!"}).catch(fallback);}catch(e){fallback()}
  };
  window.scrollTo(0,0);
  confetti([T[r.t[0]],T[r.t[1]]||"#FFCB3D","#FFCB3D","#3552D6"]);
}

intro();
</script>
</body>
</html>
